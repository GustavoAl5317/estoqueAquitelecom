# Nginx como porta de entrada da plataforma.
#
#   cp implantacao/nginx.conf /etc/nginx/sites-available/estoque
#   ln -s /etc/nginx/sites-available/estoque /etc/nginx/sites-enabled/estoque
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# Depois, o certificado (troque o domínio):
#   apt install certbot python3-certbot-nginx
#   certbot --nginx -d estoque.aquitelecom.com.br
#
# O certbot reescreve este arquivo acrescentando o bloco 443 e a renovação
# automática. Antes dele, o sistema responde só em HTTP — e sessão de login
# trafegando em HTTP numa rede que não é a do escritório é senha exposta.

server {
    listen 80;
    listen [::]:80;
    server_name estoque.aquitelecom.com.br;

    # o Next já comprime o que precisa; comprimir de novo só gasta CPU
    gzip off;

    # leitura de código de barras e foto de OS passam por aqui
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # o hot reload e qualquer stream futuro precisam do upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # a sincronização do SGP varre contrato por contrato e demora
        proxy_read_timeout 300s;
    }
}
